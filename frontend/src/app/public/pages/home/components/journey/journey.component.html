<section id="journey">
  <div class="container">
    <div class="journey-layout">
      <div>
        <p class="section-label reveal">My Path</p>
        <h2 class="section-title reveal reveal-delay-1">The<br />Journey</h2>
        <p class="skills-desc reveal reveal-delay-2">Building depth over breadth — every step deliberate, focused on mastering backend systems before expanding outward.</p>
      </div>
      <div class="timeline">
        <div class="timeline-glow"></div>
        @for (item of items; track item.title; let i = $index) {
          <div class="timeline-item reveal" [class]="'reveal-delay-' + i">
            <div class="timeline-dot"></div>
            <div class="timeline-period">{{ item.period }}</div>
            <div class="timeline-title">{{ item.title }}</div>
            <div class="timeline-org">{{ item.org }}</div>
            <div class="timeline-desc">{{ item.desc }}</div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
