<section id="skills">
  <div class="container">
    <div class="skills-layout">
      <div>
        <p class="section-label reveal">Technical Stack</p>
        <h2 class="section-title reveal reveal-delay-1">Tools &amp;<br />Technologies</h2>
        <p class="skills-desc reveal reveal-delay-2">{{ description }}</p>
      </div>
      <div class="skills-categories">
        @for (cat of categories; track cat.title; let i = $index) {
          <div class="skill-category-block reveal" [class]="'reveal-delay-' + (i + 1)">
            <div class="skill-category-title">
              <span class="skill-category-dot" [style.background]="cat.dotColor"></span>{{ cat.title }}
            </div>
            <div class="skills-list">
              @for (skill of cat.skills; track skill.name) {
                <div class="skill-row" [class.bar-visible]="barsVisible">
                  <div class="skill-row-header">
                    <span class="skill-name-text">{{ skill.name }}</span>
                    <span class="skill-percent">{{ skill.percent }}%</span>
                  </div>
                  <div class="skill-bar">
                    <div class="skill-bar-fill" 
                         [style.width.%]="skill.percent" 
                         [style.--bar-color]="cat.dotColor"></div>
                  </div>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
