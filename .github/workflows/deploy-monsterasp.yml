name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./webapi/Portfolio.slnx

      - name: Build
        run: dotnet build ./webapi/Portfolio.slnx --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish ./webapi/Portfolio.Api/PortfolioApi.csproj `
            --configuration Release `
            --no-build `
            --output ./publish

      - name: Deploy to MonsterASP via WebDeploy
        shell: cmd
        run: |
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync -source:contentPath="${{ github.workspace }}\publish" -dest:iisApp="${{ secrets.WEBSITE_NAME }}",computerName="${{ secrets.SERVER_COMPUTER_NAME }}",userName="${{ secrets.SERVER_USERNAME }}",password="${{ secrets.SERVER_PASSWORD }}",authType="Basic" -allowUntrusted -enableRule:DoNotDeleteRule -retryAttempts:3
