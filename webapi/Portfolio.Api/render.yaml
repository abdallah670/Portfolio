# Render Blueprint for Portfolio API
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: postgresql://postgres:kpeGcBdiNHkf7Q85@db.wrvzajxuobaayyvfglmf.supabase.co:5432/postgres
      - key: Jwt__Secret
        generateValue: true
      - key: Admin__Username
        value: admin
      - key: Admin__Password
        generateValue: true
      - key: Admin__Email
        value: admin@portfolio.com
      - key: EmailSettings__SmtpHost
        value: smtp.gmail.com
      - key: EmailSettings__SmtpPort
        value: "587"
      - key: EmailSettings__Username
        sync: false
      - key: EmailSettings__Password
        sync: false
      - key: EmailSettings__FromEmail
        sync: false
      - key: EmailSettings__FromName
        value: Portfolio Contact
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: AllowedOrigins
        value: "https://abdullahmohammed.netlify.app,https://*.netlify.app"
    healthCheckPath: /health

  - type: web
    name: portfolio-admin
    runtime: static
    plan: free
    buildCommand: cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/dist/frontend/browser
    envVars:
      - key: API_URL
        value: https://portfolio-api.onrender.com/api

  - type: web
    name: portfolio-public
    runtime: static
    plan: free
    buildCommand: cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/dist/frontend/browser
    envVars:
      - key: API_URL
        value: https://portfolio-api.onrender.com/api
