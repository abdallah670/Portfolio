name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore webapi/Portfolio.Api/PortfolioApi.csproj
        
      - name: Build
        run: dotnet build webapi/Portfolio.Api/PortfolioApi.csproj --configuration Release --no-restore
        
      - name: Publish
        run: dotnet publish webapi/Portfolio.Api/PortfolioApi.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false
        
      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
