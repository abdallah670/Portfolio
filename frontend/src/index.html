<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Abdullah Mohammed | Full-Stack .NET Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Backend-focused .NET developer specializing in building scalable systems using C#, SQL Server, and clean architecture.">
  <meta name="theme-color" content="#04080f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts: Cormorant Garamond, DM Sans, Fira Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
</head>
<body>
  <!-- CURSOR GLOW -->
  <div id="cursor-glow"></div>

  <!-- BACK TO TOP -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    CV download started!
  </div>

  <app-root></app-root>
<script>
window.initPortfolioJS = function() {
  if (window.amJsInitialized) return;
  window.amJsInitialized = true;
/* ─── THEME ──────────────────────────────────── */
const html = document.documentElement;
const themeIcon = document.getElementById('themeIcon');
function applyTheme(t) {
  html.setAttribute('data-theme', t);
  if (themeIcon) themeIcon.textContent = t === 'dark' ? '☀' : '☾';
  localStorage.setItem('am-theme', t);
}
applyTheme(localStorage.getItem('am-theme') || 'dark');
const themeToggleBtn = document.getElementById('themeToggle');
if (themeToggleBtn) {
  themeToggleBtn.addEventListener('click', () => {
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
}

/* ─── MOBILE MENU ────────────────────────────── */
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
if (hamburger && mobileMenu) {
  hamburger.addEventListener('click', () => {
    const open = mobileMenu.classList.toggle('open');
    hamburger.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', open);
  });
}
function closeMobileMenu() {
  if (mobileMenu) mobileMenu.classList.remove('open');
  if (hamburger) {
    hamburger.classList.remove('open');
    hamburger.setAttribute('aria-expanded', 'false');
  }
}

/* ─── NAVBAR SCROLL + SCROLLSPY ──────────────── */
const navbar = document.getElementById('navbar');
const navLinks = document.querySelectorAll('[data-nav]');
const sections = ['hero','about','skills','projects','journey','cta'].map(id => document.getElementById(id)).filter(Boolean);

window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (navbar) navbar.classList.toggle('scrolled', y > 20);

  const b2t = document.getElementById('backToTop');
  if (b2t) b2t.classList.toggle('visible', y > 500);

  // Scroll spy
  let current = '';
  sections.forEach(s => { if (y >= s.offsetTop - 120) current = s.id; });
  navLinks.forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + current);
  });
}, { passive: true });
}

const b2tBtn = document.getElementById('backToTop');
if (b2tBtn) b2tBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ─── CURSOR GLOW ────────────────────────────── */
const cursorGlow = document.getElementById('cursor-glow');
let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
function animateGlow() {
  if (cursorGlow) {
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top  = glowY + 'px';
  }
  requestAnimationFrame(animateGlow);
}
animateGlow();

/* ─── SCROLL REVEAL ─────────────────────────── */
const revealObs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); revealObs.unobserve(e.target); }});
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(el => revealObs.observe(el));

/* ─── SKILL BARS ────────────────────────────── */
const barObs = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('bar-visible'); barObs.unobserve(e.target); }});
}, { threshold: 0.4 });
document.querySelectorAll('.skill-row').forEach(el => barObs.observe(el));

/* ─── COUNTER ANIMATION ──────────────────────── */
function animateCounter(el, target, suffix, duration = 1200) {
  let start = 0;
  const step = timestamp => {
    if (!step.startTime) step.startTime = timestamp;
    const progress = Math.min((timestamp - step.startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.floor(eased * target);
    el.innerHTML = value + '<span>' + suffix + '</span>';
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const counterObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const target = +e.target.dataset.count;
      const suffix = e.target.dataset.suffix || '';
      animateCounter(e.target, target, suffix);
      counterObs.unobserve(e.target);
    }
  });
}, { threshold: 0.5 });
document.querySelectorAll('[data-count]').forEach(el => counterObs.observe(el));

/* ─── HERO NAME — CHAR ANIMATION ─────────────── */
(function() {
  const nameEl = document.getElementById('hero-name-el');
  if (!nameEl) return;
  const text = nameEl.textContent;
  nameEl.innerHTML = '';
  let delay = 0.28;
  text.split('').forEach(ch => {
    const span = document.createElement('span');
    span.className = 'name-char';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = delay + 's';
    nameEl.appendChild(span);
    delay += 0.04;
  });
})();

/* ─── TYPEWRITER ────────────────────────────── */
const lines = [
  'Backend-focused .NET developer.',
  'Building scalable systems in C# & SQL.',
  'Clean architecture — from data to UI.',
  'From Cairo, Egypt — open worldwide.',
];
let li = 0, ci = 0, del = false;
const typedEl = document.getElementById('typed-text');
function type() {
  const line = lines[li];
  typedEl.textContent = del ? line.substring(0, --ci) : line.substring(0, ++ci);
  if (!del && ci === line.length) { del = true; setTimeout(type, 2400); return; }
  if (del && ci === 0) { del = false; li = (li + 1) % lines.length; }
  setTimeout(type, del ? 38 : 62);
}
setTimeout(type, 1000);

/* ─── PARTICLES CANVAS ──────────────────────── */
(function() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = canvas.offsetWidth;
    H = canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.size = Math.random() * 1.5 + 0.3;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      this.opacity = Math.random() * 0.4 + 0.05;
      this.life = Math.random() * 200 + 100;
      this.age = 0;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.age++;
      if (this.age > this.life || this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = this.opacity * (1 - this.age / this.life);
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  for (let i = 0; i < 60; i++) particles.push(new Particle());

  // Draw connections
  function connect() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.save();
          ctx.globalAlpha = (1 - dist / 100) * 0.08;
          ctx.strokeStyle = '#3b82f6';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    connect();
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ─── 3D TILT CARD ──────────────────────────── */
(function() {
  const card = document.getElementById('tiltCard');
  if (!card) return;
  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top)  / rect.height - 0.5;
    card.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 8}deg) scale(1.02)`;
    card.style.boxShadow = `${-x * 20}px ${y * 20}px 60px rgba(59,130,246,0.2)`;
  });
  card.addEventListener('mouseleave', () => {
    card.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
    card.style.boxShadow = '';
    card.style.transition = 'all 0.5s ease';
    setTimeout(() => card.style.transition = '', 500);
  });
})();

/* ─── MAGNETIC BUTTONS ──────────────────────── */
document.querySelectorAll('.mag-btn').forEach(btn => {
  btn.addEventListener('mousemove', e => {
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top  - rect.height / 2;
    btn.style.transform = `translate(${x * 0.15}px, ${y * 0.15}px)`;
  });
  btn.addEventListener('mouseleave', () => {
    btn.style.transform = '';
    btn.style.transition = 'transform 0.4s ease';
    setTimeout(() => btn.style.transition = '', 400);
  });
});

/* ─── RIPPLE EFFECT ─────────────────────────── */
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', e => {
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 700);
  });
});

/* ─── CV DOWNLOAD ───────────────────────────── */
function downloadCV() {
  /*
    HOW TO CONNECT YOUR REAL CV:
    Replace the link.href below with the path to your CV file.
    Example: link.href = 'uploads/cv/Abdullah_Mohammed_CV.pdf';
    
    Or if your API serves it:
    link.href = '/api/files/cv';
  */
  const link = document.createElement('a');
  link.href = 'uploads/cv/Abdullah_Mohammed_CV.pdf'; // ← UPDATE THIS PATH
  link.download = 'Abdullah_Mohammed_CV.pdf';
  link.click();
  showToast();
}

function previewCV() {
  // Opens CV in a new tab for preview
  window.open('uploads/cv/Abdullah_Mohammed_CV.pdf', '_blank'); // ← UPDATE THIS PATH
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

</script>
</body>
</html>
